    <script>
    (function(){
        // لكل مكتبة عدة مصادر بديلة (CDN) تُجرَّب بالترتيب حتى ينجح أحدها —
        // حتى لو حُجب أو تعطّل أحد مزوّدي الـ CDN في بلد المستخدم، يعمل التصدير/الاستيراد.
        // المصدر الأول في كل قائمة هو نسخة محلية (بجانب ملف الموقع) — إن وُجدت تعمل دائماً
        // حتى لو حُجبت كل مزوّدات الـ CDN. ضع الملفات الثلاثة في مجلد lib بجانب الموقع لضمان
        // عمل إكسل/الطباعة بلا إنترنت خارجي. (اختياري — إن لم توجد يُتابَع تلقائياً عبر الـ CDN)
        var LIB_SRC = {
            xlsx: [
                'lib/xlsx.full.min.js',
                'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
                'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
                'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js'
            ],
            exceljs: [
                'lib/exceljs.min.js',
                'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js',
                'https://unpkg.com/exceljs@4.4.0/dist/exceljs.min.js'
            ],
            html2pdf: [
                'lib/html2pdf.bundle.min.js',
                'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js',
                'https://unpkg.com/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js'
            ]
        };
        var LIB_READY = {
            xlsx:     function(){ return typeof XLSX !== 'undefined'; },
            exceljs:  function(){ return typeof ExcelJS !== 'undefined'; },
            html2pdf: function(){ return typeof html2pdf !== 'undefined'; }
        };
        var cache = {};
        // تحميل سكربت واحد ويُعيد Promise(boolean) — مع مهلة زمنية حتى لا يتعلّق الانتظار
        function loadScript(url){
            return new Promise(function(resolve){
                var done = false;
                var s = document.createElement('script');
                s.src = url; s.async = true;
                var to = setTimeout(function(){ if(!done){ done = true; try{ s.remove(); }catch(e){} resolve(false); } }, 15000);
                s.onload  = function(){ if(!done){ done = true; clearTimeout(to); resolve(true); } };
                s.onerror = function(){ if(!done){ done = true; clearTimeout(to); try{ s.remove(); }catch(e){} resolve(false); } };
                document.head.appendChild(s);
            });
        }
        // يُحمِّل المكتبة مرة واحدة مجرّباً كل المصادر بالترتيب؛ يُعيد Promise(boolean)
        window.ensureLib = function(name){
            if (LIB_READY[name] && LIB_READY[name]()) return Promise.resolve(true);
            if (cache[name]) return cache[name];
            var sources = LIB_SRC[name] || [];
            cache[name] = (function(){
                return sources.reduce(function(chain, url){
                    return chain.then(function(ok){
                        if (ok) return true;
                        return loadScript(url).then(function(loaded){
                            // نتأكد أن الكائن العالمي أصبح متاحاً فعلاً بعد التحميل
                            return loaded && LIB_READY[name] && LIB_READY[name]() ? true : (loaded ? !!(LIB_READY[name] && LIB_READY[name]()) : false);
                        });
                    });
                }, Promise.resolve(false));
            })().then(function(ok){
                if (!ok) cache[name] = null; // اسمح بإعادة المحاولة لاحقاً
                return ok;
            });
            return cache[name];
        };
        // تحميل مُسبق هادئ بعد ظهور الصفحة (أثناء خمول المتصفح) ليكون جاهزاً عند أول تصدير/طباعة
        function preloadHeavy(){ ['xlsx','exceljs','html2pdf'].forEach(function(n){ try { window.ensureLib(n); } catch(e){} }); }
        window.addEventListener('load', function(){
            if ('requestIdleCallback' in window) requestIdleCallback(preloadHeavy, { timeout: 4000 });
            else setTimeout(preloadHeavy, 2500);
        });
    })();
    </script>

        /* Sparkline / Mini bars داخل بطاقات الإحصاءات: خلفية شفافة لا تغيّر حجم البطاقة */
        .stat-card { position: relative; overflow: hidden; }
        .stat-card > svg.spark { position: absolute; inset-inline: 0; bottom: 0; width: 100%; height: 55%; pointer-events: none; z-index: 0;
            -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 20%, #000 80%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 20%, #000 80%, transparent 100%); }
        .stats-grid-slim .stat-card > svg.spark { height: 44%; }
        .report-stats-row .stat-card > svg.spark { height: 42%; }
        .stat-card > :not(svg.spark) { position: relative; z-index: 1; }
        /* حركة الرسوم المصغّرة: ظهور تدريجي للخط، نمو الأعمدة بتتابع، وانتقال سلس عند تغيّر البيانات */
        .stat-card { transition: transform .22s ease, box-shadow .22s ease; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 60, 90, .10); }
        .stat-card > svg.spark { opacity: .85; transition: opacity .25s ease; }
        .stat-card:hover > svg.spark { opacity: 1; }
        svg.spark.sp-enter:not(.sp-bars) { animation: spReveal 1s cubic-bezier(.22,.61,.36,1) both; }
        svg.spark.sp-enter.sp-bars rect { transform-box: fill-box; transform-origin: 50% 100%; animation: spGrow .75s cubic-bezier(.22,.61,.36,1) both; animation-delay: calc(var(--i, 0) * 40ms); }
        svg.spark rect { transition: y .8s cubic-bezier(.22,.61,.36,1), height .8s cubic-bezier(.22,.61,.36,1); }
        svg.spark path { transition: d .8s cubic-bezier(.22,.61,.36,1); }
        /* تفاعل الماوس: توهّج الخط، إبراز العمود، نقطة نشطة وخط إرشادي */
        svg.spark.sp-enter.sp-replay:not(.sp-bars) { animation-duration: .7s; }
        svg.spark.sp-enter.sp-replay.sp-bars rect { animation-duration: .5s; animation-delay: calc(var(--i, 0) * 28ms); }
        svg.spark .sp-line { transition: d .8s cubic-bezier(.22,.61,.36,1), stroke-opacity .25s ease, stroke-width .25s ease, filter .25s ease; }
        .stat-card:hover svg.spark .sp-line { stroke-opacity: .95; stroke-width: 2.4; filter: drop-shadow(0 0 3px currentColor); }
        svg.spark .sp-area { transition: d .8s cubic-bezier(.22,.61,.36,1), opacity .25s ease; opacity: .85; }
        .stat-card:hover svg.spark .sp-area { opacity: 1; }
        svg.spark.sp-bars rect { transform-box: fill-box; transform-origin: 50% 100%; transition: y .8s cubic-bezier(.22,.61,.36,1), height .8s cubic-bezier(.22,.61,.36,1), fill-opacity .18s ease, scale .18s ease; }
        .stat-card:hover svg.spark.sp-bars rect { fill-opacity: .24; }
        svg.spark.sp-bars rect.sp-hot { fill-opacity: .62 !important; scale: 1 1.07; filter: drop-shadow(0 0 3px currentColor); }
        .stat-card > span.sp-dot, .stat-card > span.sp-guide { position: absolute !important; pointer-events: none; opacity: 0; z-index: 0 !important; transition: opacity .15s ease, left .08s linear, top .08s linear; }
        .stat-card > span.sp-dot { width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--sp-col, #0093c4); border: 2px solid #fff; box-shadow: 0 0 0 3px rgba(0,147,196,.28); }
        .stat-card > span.sp-guide { width: 0; border-inline-start: 1px dashed rgba(90,110,130,.55); transition: opacity .15s ease; }
        .stat-card > span.sp-dot.on, .stat-card > span.sp-guide.on { opacity: 1; }
        @keyframes spReveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
        @keyframes spGrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
        @media (prefers-reduced-motion: reduce) { svg.spark, svg.spark * { animation: none !important; transition: none !important; } .stat-card { transition: none; } .stat-card:hover { transform: none; } }

        /* ===== زر النقاط + قائمة إجراءات الصف ===== */

        /* عروض افتراضية لأعمدة جدول أوامر الشراء (يتجاوزها التحجيم اليدوي المضمّن، وتعود عند إعادة التعيين) */
        table.dt .col-actions, table.dt .col-actions, table.dt .col-actions { width: 38px; min-width: 38px; max-width: 38px; text-align: center; padding-left: 2px; padding-right: 2px; white-space: nowrap; }
        /* ===== أعراض افتراضية طبيعية لأعمدة جدول الموردين (تُستعاد عند إعادة التعيين لأنها CSS وليست inline) =====
           نضبط width + min-width + max-width معاً لأن تخطيط الجدول التلقائي يتجاهل width وحده إن كان المحتوى أضيق */
        table.dt thead th[data-colid="0"] { width: 100px; min-width: 100px; max-width: 100px; }   /* تاريخ التسجيل: أصغر قليلاً */
        table.dt thead th[data-colid="2"] { width: 220px; min-width: 220px; max-width: 220px; }   /* اسم المورد: مضاعف */
        table.dt thead th[data-colid="4"] { width: 143px; min-width: 143px; max-width: 143px; white-space: normal; }    /* نوع الخدمة: أضيق */
        table.dt thead th[data-colid="8"] { width: 79px; min-width: 79px; max-width: 79px; white-space: normal; }    /* C.R No.: أضيق ما يمكن */
        table.dt thead th[data-colid="9"] { width: 96px; min-width: 96px; max-width: 96px; white-space: normal; }    /* انتهاء السجل التجاري: أضيق */
        table.dt thead th[data-colid="10"] { width: 95px; min-width: 95px; max-width: 95px; white-space: normal; }   /* انتهاء الضريبة: أضيق ما يمكن */
        table.dt thead th[data-colid="12"] { width: 98px; min-width: 98px; max-width: 98px; white-space: normal; }   /* آخر تعديل: أضيق */
        table.dt thead th[data-colid="11"] { width: 120px; min-width: 120px; max-width: 120px; white-space: normal; }   /* أُنشئ بواسطة: أضيق */
        table.dt thead th[data-colid="13"] { width: 84px; min-width: 84px; max-width: 84px; white-space: normal; }   /* المبلغ: أضيق */
        table.dt thead th[data-colid="6"] { width: 105px; min-width: 105px; max-width: 105px; }   /* الهاتف: يتسع لنحو 10 أرقام */
        /* السماح بتحجيم عمود الهاتف للأصغر مثل باقي الأعمدة (الأرقام لا تنكسر تلقائياً فتمنع التقليص عند السحب) */
        table.dt td.col-phone { overflow-wrap: anywhere; word-break: break-word; }
        .kebab-btn { background: #f1f5f8; border: 1px solid #e1e8ee; color: #5a6b7a; width: 30px; height: 30px; border-radius: 7px; cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s; }

        .ram-item { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: none; text-align: start; padding: 9px 12px; border-radius: 7px; font-size: 13px; font-family: inherit; color: #3a4651; cursor: pointer; font-weight: 600; }

        .chart-container { position: relative; height: 280px; width: 100%; max-width: 100%; min-width: 0; }

        /* خريطة حرارية لاستخدام النظام */
        .heatmap-wrap { overflow-x: auto; padding: 6px 2px 2px; }

        /* شريط التقسيم إلى صفحات */
        .pager-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
        .pager-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .pager-right { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }

        .pager-btn.active { background: #0093c4; color: #fff; border-color: #0093c4; }

        /* الواجهة الإنجليزية: أزرار التنقّل تلي كتلة قائمة عدد الصفوف مباشرةً (بدل أقصى اليمين) */
        html[dir="ltr"] .pager-bar:not([style*="center"]) { justify-content: flex-start; gap: 18px; }
        .pager-ellipsis { padding: 0 4px; color: #9fb0bc; font-size: 12.5px; }
        /* جدول الموردين: صفوف أنحف مع الحفاظ على حجم الخط والأيقونات */
        table.dt td { padding-top: 5px; padding-bottom: 5px; }
        table.dt th { padding-top: 7px; padding-bottom: 7px; }
        /* حقلا تاريخ التصفية: تمييز البداية (أخضر) عن النهاية (برتقالي) */
        .date-filter { position: relative; display: flex; }
        .date-filter input[type="date"] { width: 100%; border-inline-start-width: 4px !important; border-inline-start-style: solid !important; }
        .date-filter.df-from input[type="date"] { border-color: #dcebdc !important; border-inline-start-color: #a8d5ab !important; background: #fafdfa; }
        .date-filter.df-to input[type="date"] { border-color: #f6e6d4 !important; border-inline-start-color: #f3c99c !important; background: #fffcf8; }
        .date-filter .df-lbl { position: absolute; top: -8px; inset-inline-start: 10px; z-index: 2; pointer-events: none; font-size: 10px; font-weight: 600; line-height: 15px; padding: 0 7px; border-radius: 8px; white-space: nowrap; }
        .date-filter.df-from .df-lbl { background: #e8f5e9; color: #4f8a55; border: 1px solid #cfe6d1; }

        .date-filter.df-to input[type="date"]:focus { box-shadow: 0 0 0 3px rgba(243,201,156,.25); }
        .filter-grid input, .filter-grid select { padding: 9px 11px; border: 1.5px solid #ddd; border-radius: 6px; font-size: 13px; font-family: inherit; }
        .filter-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        /* قائمة منسدلة متعددة الاختيارات قابلة للبحث */
        .ms-wrap { position: relative; font-size: 13px; }
        /* رفع القائمة المفتوحة فوق البطاقات والعناصر التالية لها حتى لا تُحجب */
        .ms-wrap.open { z-index: 1000; }
        .ms-control { min-height: 40px; border: 1.5px solid #ddd; border-radius: 6px; padding: 4px 8px; display: flex; align-items: center; justify-content: space-between; gap: 6px; cursor: pointer; background: #fff; box-sizing: border-box; }

        .ms-ph { color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        .ms-tag { background: #e8f4fd; color: #0093c4; border: 1px solid #b3d9f2; border-radius: 12px; padding: 1px 8px; font-size: 11.5px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; max-width: 100%; flex-shrink: 0; }
        .ms-more { background: #0093c4; color: #fff; border-radius: 12px; padding: 1px 9px; font-size: 11.5px; font-weight: 700; white-space: nowrap; flex-shrink: 0; cursor: pointer; }
        .ms-sel-head { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; background: #eaf6fb; color: #0a7399; font-size: 11.5px; font-weight: 700; padding: 4px 8px; border-radius: 6px; margin-bottom: 3px; }
        .ms-sel-head a { color: #c0392b; cursor: pointer; font-weight: 600; }

        .ms-tag-x { cursor: pointer; font-size: 10px; color: #0093c4; flex-shrink: 0; }

        .ms-caret { color: #999; font-size: 12px; flex-shrink: 0; transition: transform 0.15s; }

        .ms-dropdown { position: absolute; top: calc(100% + 4px); inset-inline: 0; background: #fff; border: 1.5px solid #0093c4; border-radius: 8px; box-shadow: 0 8px 22px rgba(0,0,0,0.14); z-index: 60; padding: 8px; display: none; }

        .ms-grip { flex: none; height: 14px; margin: 4px -8px -8px; cursor: ns-resize; position: relative; touch-action: none; user-select: none; border-top: 1px solid #eef2f5; border-radius: 0 0 8px 8px; }
        .ms-grip::after { content: ''; position: absolute; inset-inline-end: 3px; bottom: 3px; width: 9px; height: 9px;
            background: linear-gradient(135deg, transparent 0 42%, #8fa3b0 42% 52%, transparent 52% 64%, #8fa3b0 64% 74%, transparent 74% 100%); }
        [dir="rtl"] .ms-grip::after, html[dir="rtl"] .ms-grip::after { transform: scaleX(-1); }

        .ms-search { width: 100%; padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; font-family: inherit; margin-bottom: 6px; box-sizing: border-box; }

        .ms-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 11px; }

        /* حقول التصفية: خط أصغر قليلاً (13px ← 12px) دون تغيير الارتفاعات */

async function rolesTab(pane) {
